name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client git

      - name: Show tool versions
        run: |
          bash --version | head -n1
          git --version
          shellcheck --version

      - name: Run checks
        run: make check

  integration:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Gitolite
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gitolite3 openssh-client openssh-server git

      - name: Show tool versions
        run: |
          git --version
          dpkg-query -W -f='gitolite3 ${Version}\n' gitolite3

      - name: Run Gitolite integration tests
        run: sudo make test-integration

  # The same checks on the target platform, plus a real install. The job
  # runs in a throwaway container, so the install test may change it.
  debian:
    name: debian-13
    runs-on: ubuntu-26.04
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make shellcheck openssh-client openssh-server gitolite3

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show tool versions
        run: |
          . /etc/os-release && echo "$PRETTY_NAME"
          git --version
          dpkg-query -W -f='${Package} ${Version}\n' gitolite3 openssh-server shellcheck

      - name: Run checks
        run: make check

      - name: Run Gitolite integration tests
        run: make test-integration

      - name: Run install end-to-end test
        run: MGS_E2E_DISPOSABLE=1 make test-install
