name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client git

      - name: Show tool versions
        run: |
          bash --version | head -n1
          git --version
          shellcheck --version

      - name: Run checks
        run: make check

  integration:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Gitolite
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gitolite3 openssh-client git

      - name: Show tool versions
        run: |
          git --version
          dpkg-query -W -f='gitolite3 ${Version}\n' gitolite3

      - name: Run Gitolite integration tests
        run: sudo make test-integration
